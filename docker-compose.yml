services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menu-driven-calculator-backend
    expose:
      - "8080"

  frontend:
    image: nginx:alpine
    container_name: menu-driven-calculator-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend